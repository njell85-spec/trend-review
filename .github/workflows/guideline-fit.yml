# 풀 전체에 LLM 셀렉을 붙인다 (벌크).
#
# 데일리는 하루 40건까지만 판정한다 — 2년 백필 직후에는 풀이 수백 건이라 그 속도로는
# 몇 주가 걸린다. 백필을 돌린 뒤 이것을 한 번 돌리면 풀 전체에 판정이 붙고,
# 그 뒤로는 데일리가 새로 들어온 것만 따라잡는다.
name: LLM 셀렉 벌크 (가이드라인 · 리뷰)

on:
  workflow_dispatch:
    inputs:
      track:
        description: '트랙 — guidelines 진료지침 · reviews 복습용 리뷰 아티클'
        required: true
        type: choice
        default: guidelines
        options: [guidelines, reviews]
      limit:
        description: '이번에 판정할 최대 건수 (규칙 점수 높은 것부터)'
        required: true
        default: '400'
      dry_run:
        description: '저장하지 않고 결과만 본다'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# ★ 버튼(queue-control)과 **다른 그룹**을 쓴다.
#
#   2026-08-17 실측 사고: 이 워크플로를 `group: queue-control` 에 넣었더니, 15분짜리
#   2년 백필이 도는 동안 PeterJ 가 예고 리스트에서 🗑 를 세 번 눌렀는데
#   앞의 두 번이 **조용히 취소되고** 세 번째는 대기에 걸려 화면이 안 바뀌었다
#   (run #6 cancelled · #7 cancelled · #8 pending).
#   GitHub 은 **그룹당 대기 1개만** 유지하므로 연속 클릭은 앞엣것을 버린다 —
#   `curate-remove.yml` 주석이 바로 이 함정을 적어 두었는데 같은 데 빠졌다.
#
#   같은 파일(output/selected_guidelines.json)을 쓰지만 **직렬화가 필요 없다**:
#   커밋 단계가 push 실패 시 최신 main 으로 rebase 해 멱등 재적용하는 루프를 갖고 있다.
#   사람이 누르는 버튼은 **절대 배치 작업 뒤에 줄 세우지 않는다.**
concurrency:
  group: guideline-batch
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # LLM 경로는 데일리와 같다: claude CLI(구독) 우선, 없으면 Anthropic API 폴백.
      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code
      - name: workspace trust
        run: |
          node -e "const fs=require('fs'),os=require('os'),path=require('path');const p=path.join(os.homedir(),'.claude.json');let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch{};j.projects=j.projects||{};const ws=process.env.GITHUB_WORKSPACE;j.projects[ws]=Object.assign({},j.projects[ws],{hasTrustDialogAccepted:true});fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('trusted:',ws)"

      - name: 셀렉 실행
        id: fit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          IN_TRACK:                ${{ inputs.track }}
          IN_LIMIT:                ${{ inputs.limit }}
          IN_DRY:                  ${{ inputs.dry_run }}
        run: |
          DRY=""
          if [ "$IN_DRY" = "true" ]; then DRY="--dry-run"; fi
          # ★ 아래 커밋 단계를 `!inputs.dry_run` 으로 막으면 안 된다 — API 디스패치는
          #   문자열 "false" 를 보내고 GHA 에서 그것은 truthy 라 `!` 가 거짓이 된다.
          #   즉 **진짜 실행인데 커밋이 조용히 건너뛰어진다.** 셸 판정값 하나만 쓴다.
          if [ "$IN_DRY" = "true" ]; then echo "dry=true" >> "$GITHUB_OUTPUT"; else echo "dry=false" >> "$GITHUB_OUTPUT"; fi
          # ★ 트랙마다 **다른 스크립트**다. 프롬프트가 다르기 때문이다 —
          #   가이드라인 프롬프트로 리뷰를 판정하면 "지침이 아닌 것" 규정에 걸려
          #   전건이 0~2 점으로 격리된다(자세한 것은 src/utils/reviewFit.js 머리말).
          case "$IN_TRACK" in
            guidelines) SCRIPT=scripts/guideline-fit.mjs ;;
            reviews)    SCRIPT=scripts/review-fit.mjs ;;
            *) echo "::error::알 수 없는 트랙: $IN_TRACK"; exit 2 ;;
          esac
          set +e
          node "$SCRIPT" --limit "$IN_LIMIT" $DRY | tee fit.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          {
            echo "## LLM 셀렉 — $IN_TRACK"
            echo '```'
            cat fit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ★ 큐만 고치면 화면은 그대로다 — 예고는 발행 시점에 그려진다.
      #   큐제어·백필과 같은 렌더 경로를 태운다(LLM 토큰 0).
      - name: 예고 리스트 다시 그리기 · 커밋
        if: ${{ always() && steps.fit.outputs.dry == 'false' }}
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}
        run: |
          node scripts/apply-page-render.mjs
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- output/ index.html guidelines.html reviews.html; then
            echo "· 변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git add output/ index.html guidelines.html reviews.html
          git commit -m "chore(${{ inputs.track }}): LLM 셀렉 반영 (limit ${{ inputs.limit }})"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "· push 실패 — 최신 main 위로 옮겨 재시도 ($i)"
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          exit 1

      - name: 셀렉 종료 코드 반영
        if: always()
        run: |
          CODE="${{ steps.fit.outputs.code }}"
          if [ -n "$CODE" ] && [ "$CODE" != "0" ]; then
            echo "::error::LLM 셀렉(${{ inputs.track }}) exited with $CODE (4=전 배치 실패)"
            exit "$CODE"
          fi
