# 일회성 연동 프로브 — GC_USAGE_TOKEN이 타워 장부에 실제로 쓸 수 있는지만 확인한다.
# LLM을 부르지 않고 카카오도 보내지 않으므로 비용·사용자 영향이 없다.
# 이 브랜치에 push하면 스스로 1회 돌고, 확인이 끝나면 브랜치째 삭제한다.
name: Usage ledger probe (one-off)

on:
  push:
    branches: [claude/usage-ledger-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe tower ledger write access
        env:
          GC_USAGE_TOKEN: ${{ secrets.GC_USAGE_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${GC_USAGE_TOKEN:-}" ]; then
            echo "::error::GC_USAGE_TOKEN 이 이 repo에 없습니다 — secret 등록을 확인하세요."
            echo "## ❌ secret 없음" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ secret 존재 확인 (길이 ${#GC_USAGE_TOKEN})"

          if ! git clone -q --depth 1 \
              "https://x-access-token:${GC_USAGE_TOKEN}@github.com/njell85-spec/global-config.git" \
              "$RUNNER_TEMP/tower" 2>/dev/null; then
            echo "::error::타워 체크아웃 실패 — PAT의 repo 범위(global-config)/Contents 권한을 확인하세요."
            echo "## ❌ 체크아웃 실패 (권한 범위 확인 필요)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ global-config 체크아웃 성공 (Contents read 확인)"

          cd "$RUNNER_TEMP/tower"
          git config user.name  "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"

          # 합성 레코드(토큰·비용 0) — 장부는 append-only라 남지만 집계에 영향이 없고,
          # note로 실사용이 아님을 명시한다.
          if bash tools/usage/append-usage.sh \
              --surface actions --repo trend-review --task usage-probe \
              --model none --in 0 --out 0 --cache-w 0 --cache-r 0 --cost 0 \
              --auth subscription --accuracy exact \
              --run-id "${{ github.run_id }}" \
              --note "연동 검증 프로브 — 실사용 아님(토큰 0)"; then
            echo "## ✅ 장부 쓰기 성공 — PAT·secret·통로 전부 정상" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::장부 append/push 실패 — PAT에 Contents Read and write 가 있는지 확인하세요."
            echo "## ❌ push 실패 (Contents 쓰기 권한 확인 필요)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
