name: Daily EM/CCM Trend Review

on:
  schedule:
    - cron: '30 21 * * *'   # 21:30 UTC = 06:30 KST
  workflow_dispatch:          # 수동 실행

permissions:
  contents: write             # GITHUB_TOKEN으로 push 허용 (PAT 불필요)

jobs:
  review:
    runs-on: ubuntu-latest
    # 세션 한도(429) 시 최대 SESSION_RETRY_MAX회(기본 3회)를 SESSION_RETRY_DELAY_MIN
    # 간격(기본 60분)으로 재시도하므로, 잡이 재시도 대기 동안 러너를 붙잡는다.
    # public 저장소는 Actions 분(minutes)이 무료이며, 6h 기본 한도 안에서 넉넉히 마친다.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Phase 3 영상 슬라이드 렌더용 chromium — ENABLE_VIDEO=true일 때만 설치.
      # 게이트 이유: 무조건 설치하면 (a) 미사용 날에도 수 분 낭비, (b) 설치 일시 실패가
      # 코어 리포트(대시보드·카톡)까지 죽여 소프트 실패 원칙(§4-E/4-F)을 깨뜨린다.
      - name: Cache Playwright chromium
        if: ${{ vars.ENABLE_VIDEO == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}
      - name: Install Playwright chromium
        if: ${{ vars.ENABLE_VIDEO == 'true' }}
        run: npm i --no-save playwright && npx playwright install chromium --with-deps
      # ffmpeg/ffprobe — ubuntu-latest 이미지에 기본 포함 아님(실측: video-sample
      # run 28770767478 spawn ffprobe ENOENT). chromium과 동일 게이트.
      - name: Install ffmpeg
        if: ${{ vars.ENABLE_VIDEO == 'true' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # 스펙 정합 게이트 — REPORT_SPEC 위반(채널 드리프트·옛 표현·상태파일
      # gitignore 회귀)이 있으면 파이프라인을 돌리기 전에 중단한다.
      - name: Spec lint (REPORT_SPEC gate)
        run: npm run spec-lint

      # 분석 LLM 호출 경로:
      #   1) claude CLI(구독) — CLAUDE_CODE_OAUTH_TOKEN 시크릿이 있으면 사용 (API 비용 없음)
      #   2) Anthropic API   — ANTHROPIC_API_KEY 시크릿이 있으면 폴백 (CLI 미설치/미인증 시)
      # 둘 중 하나는 저장소 Secrets 에 등록해야 자동화가 동작한다.
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      # CI는 신뢰 대화상자를 못 띄우므로, 워크스페이스를 미리 신뢰 처리한다.
      # (claude CLI가 .claude/settings.json 을 읽으려면 workspace trust 필요)
      - name: Trust workspace for Claude CLI
        run: |
          node -e "const fs=require('fs'),os=require('os'),path=require('path');const p=path.join(os.homedir(),'.claude.json');let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch{};j.projects=j.projects||{};const ws=process.env.GITHUB_WORKSPACE;j.projects[ws]=Object.assign({},j.projects[ws],{hasTrustDialogAccepted:true});fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('trusted:',ws)"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run daily review pipeline
        run: node github-actions-daily.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          PUBMED_API_KEY:    ${{ secrets.PUBMED_API_KEY }}
          PUBMED_EMAIL:      ${{ secrets.PUBMED_EMAIL }}
          UNPAYWALL_EMAIL:   ${{ secrets.PUBMED_EMAIL }}
          # 논문 선정 — 결정적 상위 K편(RERANK_POOL, 기본 20)을 Opus가 "침상 임상가치"로
          # 재순위 → 1편(소프트: 실패/거부 시 결정적 순위 유지). 기본 on, vars로 끌 수 있음.
          ENABLE_RERANK:          ${{ vars.ENABLE_RERANK || 'true' }}
          RERANK_POOL:            ${{ vars.RERANK_POOL }}
          # Phase 2/3 — Google Drive·YouTube·TTS (미설정 시 해당 단계만 소프트 스킵)
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY:     ${{ secrets.GOOGLE_TTS_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          # 영상 데일리 편입 스위치 — 샘플 승인(§4-F) 후 Variables에서 true로
          ENABLE_VIDEO:           ${{ vars.ENABLE_VIDEO }}
          # 발신 언어 — 미설정 시 en(영어 단일). 한국어 확장은 Variables에 en,ko 설정만으로.
          VIDEO_LANGS:            ${{ vars.VIDEO_LANGS }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER:      ${{ github.repository_owner }}
          GITHUB_REPO:       ${{ github.event.repository.name }}
          # 재시도 정책 튜닝(선택): 저장소 Variables 에 설정하면 코드 수정 없이 조정된다.
          # 미설정 시 기본값(3회 / 60분)이 적용된다. timeout-minutes 도 함께 고려할 것.
          SESSION_RETRY_MAX:       ${{ vars.SESSION_RETRY_MAX }}
          SESSION_RETRY_DELAY_MIN: ${{ vars.SESSION_RETRY_DELAY_MIN }}
          # 이번 실행의 토큰·비용 요약 덤프 경로 — 아래 장부 스텝이 읽는다.
          # 러너 임시 디렉터리라 repo에 커밋되지 않는다(public repo에 사용량 숫자
          # 파일을 커밋하지 않는다는 타워 장부 불변계약).
          USAGE_OUT: ${{ runner.temp }}/usage-run.json

      # 스크립트가 index.html 커밋·푸시 후 상태파일(선정 논문 제외목록 + 가이드라인 주간
      # 게이트)을 갱신하므로, 두 번째 커밋으로 그 상태를 동기화한다.
      # selected_guidelines.json 을 커밋해야 "주 1회 + 중복방지"가 실행 간 유지된다.
      - name: Commit daily state (papers + guideline gate + archive/video)
        run: |
          git add output/selected_papers.json
          for f in output/selected_guidelines.json output/analysis_archive.json output/video_log.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet \
            && echo "state unchanged" \
            || (git commit -m "chore: sync daily state (papers + guideline gate + archive/video)" && git push)

      # 타워(global-config)의 사용량 장부에 이번 실행의 토큰·비용을 적재한다.
      # 규칙 정본: global-config rulebook/usage-accounting.md (계약 C1).
      #
      # 이 스텝은 절대 데일리를 빨갛게 만들지 않는다 — 리포트 발행이 본업이고 관제는
      # 부가 기능이다. 그래서 continue-on-error + 모든 분기에서 exit 0로 빠진다.
      # if: always() 인 이유는 파이프라인이 소프트 실패한 날에도 태운 토큰은 기록해야
      # 하기 때문이다(오히려 그런 날 기록이 필요하다).
      # timeout-minutes 가 필수다: continue-on-error는 "실패"만 덮고 "멈춤"은 못 덮는다.
      # 클론이 네트워크에서 행이면 잡의 240분을 태우고 잡이 취소되는데, 그러면
      # needs: review 인 verify-pages(2026-07-05 사고 후 만든 Pages 배포 안전망)가
      # 아예 실행되지 않는다 — 부가 기능이 본업 가드를 죽이는 최악의 경로다.
      - name: Append usage to tower ledger
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          GC_USAGE_TOKEN: ${{ secrets.GC_USAGE_TOKEN }}
          USAGE_FILE: ${{ runner.temp }}/usage-run.json
          GIT_TERMINAL_PROMPT: '0'   # 인증 프롬프트로 멈추지 않고 즉시 실패하게
        run: |
          set -uo pipefail

          if [ -z "${GC_USAGE_TOKEN:-}" ]; then
            echo "::notice::GC_USAGE_TOKEN 미설정 — 장부 적재를 건너뜁니다."
            exit 0
          fi
          if [ ! -s "$USAGE_FILE" ]; then
            echo "::notice::사용량 요약 파일이 없습니다 — LLM 호출 전에 끝난 실행으로 봅니다."
            exit 0
          fi
          # jq가 깨진 JSON을 만나면 stdout이 비어 "" != "0" 이 되고 그대로 통과해버린다
          # (프로세스가 writeFileSync 중간에 죽으면 실제로 생길 수 있다). 기본값으로 막는다.
          COUNT="$(jq -r '.records | length' "$USAGE_FILE" 2>/dev/null || echo 0)"
          if [ "${COUNT:-0}" -le 0 ] 2>/dev/null; then
            echo "::notice::기록할 LLM 호출이 없거나 요약이 손상됐습니다 — 건너뜁니다."
            exit 0
          fi

          # PAT는 remote URL에만 쓰고 절대 echo하지 않는다. -q와 stderr 차단으로
          # 실패 메시지에 토큰이 섞여 로그에 남는 것도 막는다.
          if ! git clone -q --depth 1 \
              "https://x-access-token:${GC_USAGE_TOKEN}@github.com/njell85-spec/global-config.git" \
              "$RUNNER_TEMP/tower" 2>/dev/null; then
            echo "::warning::타워 체크아웃 실패 — GC_USAGE_TOKEN의 권한/만료를 확인하세요(장부 적재만 건너뜁니다)."
            exit 0
          fi

          # cd 실패 시 그냥 진행하면 아래 git config가 trend-review 워크스페이스에서 돌아
          # github-actions[bot] 신원을 usage-bot으로 덮어쓴다 — 반드시 여기서 빠진다.
          cd "$RUNNER_TEMP/tower" || { echo "::warning::타워 디렉터리 진입 실패 — 건너뜁니다."; exit 0; }
          git config user.name  "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"

          # 레코드는 (auth, 모델)마다 1줄로 나뉘어 온다 — 줄 단위로 적재한다.
          # append-usage.sh 에 </dev/null 을 주는 이유: 안 주면 이 while 루프의 stdin(jq
          # 파이프)을 물려받아, 안쪽 git이 stdin을 한 번이라도 읽으면 남은 레코드를 삼킨다.
          jq -c '.records[]' "$USAGE_FILE" | while read -r rec; do
            f() { printf '%s' "$rec" | jq -r "$1"; }
            bash tools/usage/append-usage.sh \
              --surface actions \
              --repo    "${{ github.event.repository.name }}" \
              --task    daily-review \
              --model   "$(f .model)" \
              --in      "$(f .in)" \
              --out     "$(f .out)" \
              --cache-w "$(f .cache_w)" \
              --cache-r "$(f .cache_r)" \
              --cost    "$(f .cost_usd)" \
              --auth    "$(f .auth)" \
              --accuracy "$(f .accuracy)" \
              --note    "$(f .note)" \
              --run-id  "${{ github.run_id }}" \
              </dev/null >/dev/null || echo "::warning::장부 append 실패 — 이 레코드는 누락됩니다."
          done

          # 금지된 건 public repo에 사용량 숫자 '파일'을 커밋하는 것이고,
          # 로그·job summary 표시는 허용된다(장부 불변계약).
          {
            echo "### 📊 사용량 장부 적재"
            jq -r '.records[] | "- \(.auth) · \(.model) — in \(.in) · out \(.out) · cache_w \(.cache_w) · cache_r \(.cache_r) · $\(.cost_usd)"' "$USAGE_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

  # push 성공 ≠ 사이트 반영. GitHub 측 Pages 배포가 일시 오류로 실패하면
  # 카톡 링크가 전날 데이터를 보여준다(2026-07-05 실제 발생). 배포 완료를
  # 확인하고 실패 시 자동 재실행, 끝내 실패하면 카카오 알림 + 워크플로우 실패.
  # 별도 잡인 이유: 재실행에 필요한 actions:write 토큰을 LLM 파이프라인 잡
  # (외부 콘텐츠를 다루는 단계)에 쥐여 주지 않기 위한 권한 분리.
  verify-pages:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read          # 스크립트 실행용 체크아웃 + 원격 main 조회
      actions: write          # 실패한 Pages 배포 런 재실행
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages deployment (auto-retry)
        run: node scripts/verify-pages-deploy.mjs
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
