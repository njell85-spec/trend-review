name: On-demand Analysis (직접 지정)

# 대시보드 "직접 지정 분석" 위젯(또는 Actions 수동 실행)에서 트리거.
# 데일리와 동일한 분석 경로로 지정 논문/가이드라인/참고자료를 처리한다 (REPORT_SPEC §1-B).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'PMID 또는 DOI (가이드라인·참고자료는 원문 URL도 가능)'
        required: true
        type: string
      kind:
        description: '종류'
        required: false
        default: 'paper'
        type: choice
        # ★ review 는 예고 리스트의 ▶ 가 리뷰 트랙에서 부르는 값이다. 여기 없으면
        #   workflow_dispatch 가 422 로 튕겨 버튼이 조용히 죽는다 — 스크립트만
        #   고치고 여기를 빼먹으면 아무 것도 안 달라진다.
        options: [paper, guideline, reference, review]
      title:
        description: '문서 제목 (URL 지정용, 선택 — 비우면 페이지 <title>)'
        required: false
        default: ''
        type: string
      org:
        description: '발행 기관 (URL 지정용, 선택 — 예: IDSA)'
        required: false
        default: ''
        type: string
      pubdate:
        description: '발행/기준 일자 (URL 지정용, 선택 — 예: 2026-03)'
        required: false
        default: ''
        type: string
      # 페이월 문헌(NEJM 등)은 러너가 원문을 못 읽어 카드가 초록 수준으로 얇아진다.
      # 그때만 쓰는 통로. **공개 저장소이고 이 입력값은 Actions 실행 화면에 남으므로**
      # 유료 원문을 그대로 붙이지 말고 수치·역치·권고 위주의 사실 정리본을 넣는다.
      sourceText:
        description: '본문 정리본 (선택 — 페이월로 원문을 못 읽을 때만. 원문 전재 금지)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Spec lint (REPORT_SPEC gate)
        run: npm run spec-lint

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace for Claude CLI
        run: |
          node -e "const fs=require('fs'),os=require('os'),path=require('path');const p=path.join(os.homedir(),'.claude.json');let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch{};j.projects=j.projects||{};const ws=process.env.GITHUB_WORKSPACE;j.projects[ws]=Object.assign({},j.projects[ws],{hasTrustDialogAccepted:true});fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('trusted:',ws)"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # inputs 는 env 로만 전달 — run 에 ${{ }} 직접 보간 시 셸 인젝션 가능(actions:write
      # 보유자가 임의 명령 실행). PAT 소지자는 신뢰 대상이지만 심층 방어로 차단한다.
      - name: Run on-demand analysis
        run: node scripts/on-demand.mjs "$OD_TARGET" "$OD_KIND"
        env:
          USAGE_OUT: ${{ runner.temp }}/usage-run.json
          OD_TARGET: ${{ inputs.target }}
          OD_KIND:   ${{ inputs.kind }}
          OD_TITLE:  ${{ inputs.title }}
          OD_ORG:    ${{ inputs.org }}
          OD_DATE:   ${{ inputs.pubdate }}
          OD_SOURCE_TEXT: ${{ inputs.sourceText }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBMED_API_KEY:    ${{ secrets.PUBMED_API_KEY }}
          PUBMED_EMAIL:      ${{ secrets.PUBMED_EMAIL }}
          UNPAYWALL_EMAIL:   ${{ secrets.PUBMED_EMAIL }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER:      ${{ github.repository_owner }}
          GITHUB_REPO:       ${{ github.event.repository.name }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}

      # 상태파일 동기화 — 데일리와 동일 패턴 (publisher가 index+selected를 이미 커밋·push,
      # analysis_archive 만 여기서 추가 커밋). publish()가 push까지 마쳐 local==origin 이므로
      # 별도 pull/rebase 없이 add→commit→push. (pull --rebase는 REST 폴백 시 rebase 충돌을
      # || true 로 삼켜 충돌 마커를 커밋할 위험이 있어 제거 — 실패는 조용히 삼키지 않는다.)
      - name: Commit state (archive)
        run: |
          for f in output/analysis_archive.json output/selected_papers.json output/selected_guidelines.json output/selected_references.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet \
            && echo "state unchanged" \
            || (git commit -m "chore: sync on-demand state" && git push)

      # 사용량 장부 적재 — 이 워크플로우도 LLM을 태운다(공용 액션).
      - name: Append usage to tower ledger
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/append-usage
        with:
          token: ${{ secrets.GC_USAGE_TOKEN }}
          task: on-demand
          usage-file: ${{ runner.temp }}/usage-run.json
