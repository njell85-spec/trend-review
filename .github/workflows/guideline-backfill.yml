name: Guideline backfill (캐치업 백로그)

on:
  workflow_dispatch:
    inputs:
      windows:
        description: '창 — monthly:24 = 2년치를 30일씩 24조각 (기본). 명시 창도 됨: 60-30,150-120'
        required: true
        default: 'monthly:24'
      apply:
        description: '큐에 실제로 반영한다 (끄면 리포트만 — 종전 동작)'
        required: false
        default: false
        type: boolean

# 데일리·큐제어와 같은 파일(output/selected_guidelines.json)을 쓴다.
permissions:
  contents: write
concurrency:
  group: queue-control
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 창 24개 × 쿼리 13개 + esummary·efetch. PubMed 레이트리밋(키 있으면 10req/s)을
    # 지키며 도는 시간이 대부분이다 — LLM 은 안 쓴다.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ★ 정지 신호가 있으면 CLI 가 0 이 아닌 코드로 끝난다(설계). 그 자체는 옳지만
      #   여기서 잡지 않으면 **뒤의 요약·커밋 단계가 통째로 안 돈다** — 가장 봐야 할
      #   리포트가 사라지고, --apply 로 이미 고친 큐 파일이 커밋 안 된 채 러너와 함께
      #   버려진다. 코드는 기억해 뒀다가 마지막에 잡을 빨갛게 만든다.
      - name: Run replay experiment
        id: replay
        env:
          PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_APPLY: ${{ inputs.apply }}
        run: |
          APPLY=""
          if [ "$IN_APPLY" = "true" ]; then APPLY="--apply"; fi
          # ★ 뒤 단계의 게이트를 `${{ inputs.apply }}` 로 직접 쓰지 않는다.
          #   UI 로 누르면 진짜 boolean 이 오지만 **API 로 디스패치하면 문자열**이 온다.
          #   GHA 에서 비어 있지 않은 문자열은 전부 truthy 이므로 `if: inputs.apply` 는
          #   apply=false 인 dry-run 에서도 참이 되고, 반대로 `if: !inputs.dry_run` 은
          #   문자열 "false" 에 대해 거짓이 되어 **진짜 실행의 커밋이 조용히 건너뛰어진다.**
          #   여기서 셸이 판정한 값 하나만 내보내 아래가 그것을 보게 한다.
          if [ "$IN_APPLY" = "true" ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
          set +e
          node scripts/guideline-backfill.mjs --windows "$IN_WINDOWS" --out guideline-backfill-report.json $APPLY
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e
      # 요약을 **로그와 잡 요약에 찍는다.** artifact 는 인증이 있어야 열리는데, 이 실험의
      # 결론(초집합·큐 순도·큐 깊이)은 폰에서 바로 보여야 한다.
      - name: Summarize report
        if: always()
        run: |
          node -e '
            const r = require("./guideline-backfill-report.json");
            const L = [];
            L.push("## 가이드라인 재생 실험 — 창 " + r.windows.length + "개");
            L.push("");
            L.push("| 창 | 후보 | queued | needsReview | rejected | 초집합 위반 | 앵커 재현율 | 큐 지속일 |");
            L.push("|---|---|---|---|---|---|---|---|");
            for (const w of r.windows) {
              const sv = w.supersetViolation;
              const v = sv.evaluated === false ? "판정불가" : (sv.violated ? "★" + sv.missing.length + "건" : "없음");
              const rr = w.anchors.recallRate === null ? "—" : (w.anchors.recallRate * 100).toFixed(0) + "%";
              L.push(`| ${w.window.label} (${w.window.minDate}~${w.window.maxDate}) | ${w.counts.candidates} | ${w.counts.queued} | ${w.counts.needsReview} | ${w.counts.rejected} | ${v} | ${rr} | ${w.queueDepth.daysSustainable} |`);
            }
            L.push("");
            L.push("정지 신호 " + r.stopSignals.length + "건");
            for (const s of r.stopSignals) L.push("- " + s);
            L.push("");
            L.push("### 일자별 발행 시뮬레이션 — 그날 아침 이 로직이 돌았다면");
            for (const w of r.windows) {
              const s = w.simulation ?? { days: [], publishedDays: 0, skippedDays: 0, coverage: 0 };
              L.push("");
              L.push(`**${w.window.label} (${w.window.minDate}~${w.window.maxDate})** — 발행 ${s.publishedDays}일 / 건너뜀 ${s.skippedDays}일 (${(s.coverage*100).toFixed(0)}%)`);
              L.push("");
              L.push("| 날짜 | 결과 | 기관 | 뽑힌 지침 |");
              L.push("|---|---|---|---|");
              for (const d of s.days) {
                if (d.outcome === "published") L.push(`| ${d.date} | 발행 | ${d.org ?? "-"} | ${d.title} |`);
                else L.push(`| ${d.date} | 건너뜀 | — | (큐 비어 있음) |`);
              }
            }
            L.push("");
            L.push("### queued 전수 감사 대상 (판정은 마지막 두 칸 — 블라인드로 먼저 보라)");
            for (const w of r.windows) {
              for (const q of (w.audit.queued ?? [])) {
                L.push(`- [${w.window.label}] ${q.pmid} · ${q.organizationId ?? "-"} · p=${(q.priority ?? 0).toFixed(1)} · ${q.title} — ${q.verdict}/${(q.reasons ?? []).join("+")}`);
              }
            }
            L.push("");
            L.push("### rejected 표본 (미탐 감사)");
            for (const w of r.windows) {
              for (const q of (w.rejectedSample ?? []).slice(0, 8)) {
                L.push(`- [${w.window.label}] ${q.pmid} · ${q.title} — ${(q.reasons ?? []).join("+")}`);
              }
            }
            const out = L.join("\n");
            console.log(out);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '

      # ★ --apply 로 큐를 고쳤으면 **커밋해야 실물이 된다.** 안 그러면 러너가 죽으면서
      #   같이 사라지고, 로그만 "반영했다" 라고 말한다. 예고 리스트는 발행 시점에 그려지므로
      #   큐제어와 같은 렌더 경로를 한 번 태운다(LLM 토큰 0).
      - name: 예고 리스트 다시 그리기 · 커밋 (apply 일 때만)
        if: ${{ always() && steps.replay.outputs.apply == 'true' }}
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}
        run: |
          node scripts/apply-page-render.mjs
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- output/ index.html guidelines.html reviews.html; then
            echo "· 변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git add output/ index.html guidelines.html reviews.html
          git commit -m "chore(guidelines): backfill apply ${{ inputs.windows }}"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "· push 실패 — 최신 main 위로 옮겨 재시도 ($i)"
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          exit 1

      # ★ 리포트는 실행이 실패해도 반드시 올린다.
      #   CLI 는 수집 실패(3)·정지 신호(4)에 0 이 아닌 코드로 끝난다 — 그래야 실패한 실험이
      #   성공처럼 안 보인다. 그런데 업로드가 그 실패에 딸려 건너뛰면 **가장 봐야 할 리포트가
      #   사라진다.** 잡은 빨갛게 두고 산출물은 남긴다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guideline-backfill-report
          path: guideline-backfill-report.json
          if-no-files-found: error

      # 실험 자체의 실패·정지 신호는 마지막에 드러낸다 — 리포트와 커밋을 다 남긴 뒤에.
      - name: 실험 종료 코드 반영
        if: always()
        run: |
          CODE="${{ steps.replay.outputs.code }}"
          if [ -n "$CODE" ] && [ "$CODE" != "0" ]; then
            echo "::error::guideline-backfill exited with $CODE (3=수집 실패 · 4=정지 신호) — 위 요약을 보라"
            exit "$CODE"
          fi
