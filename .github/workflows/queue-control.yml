# 예고 리스트 버튼(🗑 빼기 · ▶ 먼저 돌리기 · ♻ 전체 갈아엎기)의 실행부.
#
# 배포 페이지의 UPBTN 스크립트가 PAT(workflow_dispatch)로 부른다.
# 큐 파일만 고치고 커밋한다 — 분석·발행은 하지 않는다(그건 데일리와 on-demand 의 몫).
name: Queue Control (예고 리스트 버튼)

on:
  workflow_dispatch:
    inputs:
      track:
        description: '트랙'
        required: true
        type: choice
        options: [papers, guidelines, reviews]
      action:
        description: '동작 — drop 빼기 · promote 먼저 돌리기 · reset 전체 갈아엎기'
        required: true
        type: choice
        options: [drop, promote, reset]
      id:
        description: 'PMID (drop·promote 에만 필요)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 데일리 커밋과 경합할 수 있다. 데일리에 같은 그룹을 걸지는 않는다 —
# 데일리 코어 무영향이 불변식이므로, 여기서 push 실패 시 재시도한다.
concurrency:
  group: queue-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★ `id` 는 자유 입력이다. `${{ }}` 로 셸에 직접 펼치면 따옴표를 탈출해 러너에서
      #   임의 명령이 돈다(코드리뷰 실측). env 로 넘기면 셸이 값으로만 취급한다.
      #   `track`·`action` 은 choice 라 값이 고정이지만 같은 방식으로 통일한다.
      - name: 큐 갱신
        env:
          IN_TRACK:  ${{ inputs.track }}
          IN_ACTION: ${{ inputs.action }}
          IN_ID:     ${{ inputs.id }}
        run: |
          node scripts/queue-control.mjs --track "$IN_TRACK" --action "$IN_ACTION" --id "$IN_ID"

      # ★ 큐만 고치면 **화면은 그대로다** (2026-08-17 실측 — 🗑 를 눌러 큐에서 빠졌는데
      #   예고 리스트에는 그대로 남아 있었다). 예고는 발행 시점에 그려지므로, 여기서
      #   렌더 경로를 한 번 태워야 "1~2분 뒤 새로고침하면 반영됩니다" 가 참이 된다.
      #   분석·수집은 하지 않는다 — LLM 토큰 0.
      - name: 예고 리스트 다시 그리기
        run: npm ci --omit=dev && node scripts/apply-page-render.mjs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO:  ${{ github.event.repository.name }}

      - name: 커밋 · 푸시 (경합 시 재시도)
        env:
          IN_TRACK:  ${{ inputs.track }}
          IN_ACTION: ${{ inputs.action }}
          IN_ID:     ${{ inputs.id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- output/ index.html guidelines.html reviews.html; then
            echo "· 변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git add output/ index.html guidelines.html reviews.html
          git commit -m "chore(queue): $IN_TRACK $IN_ACTION $IN_ID"
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "· push 실패 — 최신 main 위로 옮겨 재시도 ($i)"
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          exit 1
