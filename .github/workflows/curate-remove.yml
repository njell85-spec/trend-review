# 대시보드 삭제 버튼(R4) — 섹션 숨김 기록 + index.html/guidelines.html 패치 커밋 (REPORT_SPEC §4-G·§4-H)
#
# 대시보드 CURATION_BLOCK이 PAT(workflow_dispatch)로 호출한다. 삭제는 표시 제거만 —
# Drive Doc·아카이브·재선정 방지 목록 유지(HANDOFF §10-P2 경계).
# 데일리 커밋과의 경합: 같은 concurrency 그룹을 daily-review.yml에 넣는 대신(데일리
# 코어 무영향 불변식) push 실패 시 최신 main으로 리셋 후 멱등 재적용하는 재시도 루프.
name: Curate Remove (대시보드 삭제)

on:
  workflow_dispatch:
    inputs:
      sectionKey:
        description: '섹션 키 (YYYY-MM-DD 또는 YYYY-MM-DD-m-<pmid>)'
        required: true
        type: string
      tag:
        description: '섹션 태그 — 같은 날짜에 논문·가이드·리뷰 섹션이 공존하므로 필수 구분'
        required: false
        default: 'SECTION'
        type: choice
        # ★ RSECTION(리뷰)은 2026-08-16 3트랙 개편에서 생겼는데 여기 안 들어와 있었다.
        #   버튼이 RSECTION 을 보내면 workflow_dispatch 가 422 로 튕긴다 —
        #   클라이언트를 고쳐도 여기가 막혀 있으면 여전히 안 먹는다.
        options: [SECTION, GSECTION, RSECTION]
      pmid:
        description: '논문 PMID (누적 표 행 제거용)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# concurrency 그룹을 쓰지 않는 이유(리뷰 M3): GitHub는 그룹당 대기 1개만 유지해
# 연속 클릭 시 앞선 요청이 조용히 취소된다. 짧은 잡 + push 경합은 아래 재시도
# 루프(최신 main 재적용, 멱등)로 처리하므로 직렬화가 필요 없다.

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # curation.js·dates.js는 npm 의존 0 — npm ci 없이 바로 실행(레지스트리 장애 격리)

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # inputs는 env 경유(셸 인젝션 심층 방어, on-demand.yml과 동일)
      - name: Apply removal + commit (경합 재시도)
        env:
          CUR_SECTION_KEY: ${{ inputs.sectionKey }}
          CUR_TAG:         ${{ inputs.tag }}
          CUR_PMID:        ${{ inputs.pmid }}
        run: |
          for i in 1 2 3; do
            node scripts/curate-remove.mjs
            # ★★ 스크립트가 **건드릴 수 있는 것을 전부** 올린다. 이 목록에서 빠지면
            #   러너에서는 고쳐지고 커밋만 안 돼서 **push 가 성공으로 끝난다** —
            #   이 저장소가 이미 한 번 데인 자리다(08-16: reviews.html·트랙 큐 누락).
            #   2026-08-17 에 또 같은 데 빠졌다: analysis_archive.json 프루닝과
            #   reviews.html 패치를 새로 붙였는데 이 줄을 안 고쳤다. 증상이 고약하다 —
            #   index.html 의 목록 블록은 프루닝된 값으로 다시 그려져 **화면은 맞는데**,
            #   JSON 이 안 올라가서 **다음 데일리 렌더가 지운 항목을 되살린다.**
            git add index.html output/curation_state.json output/analysis_archive.json
            # 가이드·기타 카드는 guidelines.html, 리뷰 카드는 reviews.html 에 있다(§4-H).
            # 빠뜨리면 그 트랙의 삭제가 커밋되지 않는다.
            for f in guidelines.html reviews.html; do
              [ -f "$f" ] && git add "$f" || true
            done
            if git diff --staged --quiet; then echo "변경 없음(멱등) — 종료"; exit 0; fi
            git commit -m "chore(curation): 대시보드 삭제 — $CUR_SECTION_KEY"
            if git push; then echo "완료"; exit 0; fi
            echo "push 경합 — 최신 main으로 재적용 ($i/3)"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::3회 재시도 후에도 push 실패 (데일리와 지속 경합?)"
          exit 1
