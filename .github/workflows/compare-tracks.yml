# .github/workflows/compare-tracks.yml
name: Track Comparison (Arm1 vs Arm2 · 2주 실험)

# 데일리(06:30 KST) 커밋 이후 08:00 KST(=23:00 UTC 전날)에 실행하던 2주 실험.
# 데일리 코어 무접촉: output/analysis_archive.json 읽기만, experiments/ 만 커밋.
# 2026-08-15: 스케줄 제거 — 실험 수집(7/12~7/30)이 끝난 뒤 스크립트가 매일 no-op 으로만
# 돌고 있었다(TRACK_COMPARE_END 경과, 실측 0초 스텝). 데이터는 experiments/ 에 보존돼 있고
# 19일치 분석은 별도 task 다. 재실험 때는 workflow_dispatch 로 수동 실행하거나 스케줄을 되살린다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Trust workspace
        run: node -e "const fs=require('fs'),os=require('os'),path=require('path');const p=path.join(os.homedir(),'.claude.json');let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch{};j.projects=j.projects||{};const ws=process.env.GITHUB_WORKSPACE;j.projects[ws]=Object.assign({},j.projects[ws],{hasTrustDialogAccepted:true});fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('trusted:',ws)"

      - name: Configure git identity
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"

      - name: Run track comparison
        run: node scripts/compare-tracks.mjs
        env:
          USAGE_OUT: ${{ runner.temp }}/usage-run.json
          ENABLE_TRACK_COMPARE:   ${{ vars.ENABLE_TRACK_COMPARE }}
          TRACK_COMPARE_END:      ${{ vars.TRACK_COMPARE_END }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          PUBMED_API_KEY:         ${{ secrets.PUBMED_API_KEY }}
          PUBMED_EMAIL:           ${{ secrets.PUBMED_EMAIL }}
          ANALYSIS_MODEL:         ${{ vars.ANALYSIS_MODEL }}
          # Arm2 웹탐색은 열린 과제라 턴을 많이 먹는다 — 기본 12 대신 상향(데일리는 미설정=12 유지).
          LLM_WEB_MAX_TURNS:      '30'
          LLM_WEB_TIMEOUT_MS:     '600000'

      # 사용량 장부 적재 — 이 워크플로우도 LLM을 태운다(공용 액션).
      - name: Append usage to tower ledger
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/append-usage
        with:
          token: ${{ secrets.GC_USAGE_TOKEN }}
          task: compare-tracks
          usage-file: ${{ runner.temp }}/usage-run.json
